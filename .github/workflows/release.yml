name: Release

# Publishes every workspace package to GitHub Packages when a version tag is
# pushed. Flow: bump versions (lockstep) on main → tag v<version> → push tag.
# Auth is the workflow's own GITHUB_TOKEN — no secrets to manage. After the
# FIRST publish, grant each consumer repo read access on every package
# (package page → Package settings → Manage Actions access), or their CI
# cannot install these packages.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish
        run: pnpm -r publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
