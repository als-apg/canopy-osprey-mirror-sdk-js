name: Release

# Publishes every workspace package to GitHub Packages when a version tag is
# pushed. Flow: bump versions (lockstep) on main → tag v<version> → push tag.
# Auth is the workflow's own GITHUB_TOKEN — no secrets to manage. After the
# FIRST publish, grant each consumer repo read access on every package
# (package page → Package settings → Manage Actions access), or their CI
# cannot install these packages.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"

      - name: Verify tag matches package versions
        # Guard against the silent-skip footgun: pnpm -r publish skips any
        # version the registry already has, so an un-bumped manifest turns a
        # release into a green no-op. Fail loudly instead.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FAIL=0
          for f in packages/*/package.json; do
            PKG_NAME=$(node -p "require('./$f').name")
            PKG_VERSION=$(node -p "require('./$f').version")
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::$PKG_NAME is $PKG_VERSION but the tag says $TAG_VERSION (lockstep bump missing)"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish
        run: pnpm -r publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
